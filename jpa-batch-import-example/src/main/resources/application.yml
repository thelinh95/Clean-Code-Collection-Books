spring:
  datasource:
    url: jdbc:h2:mem:importdb;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: create-drop
    show-sql: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          batch_versioned_data: true
        order_inserts: true
        order_updates: true
        generate_statistics: false

import:
  demo:
    enabled: false
    lines: 10000
    customers: 100
    products: 100
    csv-path: ${java.io.tmpdir}/order-lines-10000.csv
